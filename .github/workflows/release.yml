name: Release

on:
  push:
    branches:
      - mainstream
  release:
    types: [published]

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
      - name: Add nightly pack options
        if: github.event_name != 'release'
        id: pack-options-nightly
        run: echo "value=--version-suffix nightly.${{ github.run_number }}" >> $GITHUB_OUTPUT
      - name: Pack
        run: dotnet pack -c Release -o ./pack ${{ steps.pack-options-nightly.outputs.value }}
      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: ./pack
  release:
    needs: pack
    environment: ${{ github.event_name == 'release' && 'release' || 'nightly' }}
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
      - name: Obtain NuGet API token
        uses: nuget/login@v1
        id: nuget-login
        with:
          user: ${{ vars.NUGET_USER }}
        if: vars.NUGET_USER != ''
      - name: Download package artifacts
        uses: actions/download-artifact@v5
        with:
          name: nuget-packages
          path: ./pack
      - name: Publish
        run: dotnet nuget push ./pack/*.nupkg --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY || secrets.NUGET_KEY }} --source ${{ vars.NUGET_FEED }}
